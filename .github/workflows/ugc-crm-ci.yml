name: Partner CRM and affiliate authentication validation
on:
  pull_request:
    paths:
      - 'src/app/admin/ugc-crm/**'
      - 'src/app/api/admin/ugc-crm/**'
      - 'src/lib/ugc-crm.ts'
      - 'src/app/admin/layout.tsx'
      - 'prisma/**'
      - 'tests/hv-ugc-crm.test.mjs'
      - 'src/lib/otp.ts'
      - 'src/lib/affiliate-auth-policy.ts'
      - 'src/app/register/page.tsx'
      - 'src/app/api/auth/**'
      - 'tests/affiliate-auth-security.test.mjs'
      - 'tests/register-password-ux.test.mjs'
      - 'src/lib/auto-partner-shopify-coupon.ts'
      - 'tests/auto-partner-shopify-coupon.test.mjs'
      - 'src/lib/auto-coupon-settings.ts'
      - 'src/app/api/admin/coupons/auto-settings/**'
      - 'src/app/admin/coupons/**'
      - 'tests/auto-coupon-settings.test.mjs'
      - 'src/app/r/**'
      - 'src/app/api/affiliate/shopify-coupons/**'
      - 'src/lib/hv-shopify-discounts.ts'
      - 'tests/affiliate-landing-code-ref.test.mjs'
      - 'src/lib/short-partner-code.ts'
      - 'src/app/api/admin/coupons/route.ts'
      - 'tests/three-character-affiliate-codes.test.mjs'
      - 'src/app/api/affiliate/promo-code/**'
      - 'src/app/affiliate/coupons/**'
      - 'src/app/login/page.tsx'
      - 'tests/partner-selected-promo-code.test.mjs'
      - '.github/workflows/ugc-crm-ci.yml'
  push:
    branches:
      - 'feat/hv-partner-ugc-crm-20261031'
    paths:
      - 'src/app/admin/ugc-crm/**'
      - 'src/app/api/admin/ugc-crm/**'
      - 'src/lib/ugc-crm.ts'
      - 'src/app/admin/layout.tsx'
      - 'prisma/**'
      - 'tests/hv-ugc-crm.test.mjs'
      - 'src/lib/otp.ts'
      - 'src/lib/affiliate-auth-policy.ts'
      - 'src/app/register/page.tsx'
      - 'src/app/api/auth/**'
      - 'tests/affiliate-auth-security.test.mjs'
      - 'tests/register-password-ux.test.mjs'
      - 'src/lib/auto-partner-shopify-coupon.ts'
      - 'tests/auto-partner-shopify-coupon.test.mjs'
      - 'src/lib/auto-coupon-settings.ts'
      - 'src/app/api/admin/coupons/auto-settings/**'
      - 'src/app/admin/coupons/**'
      - 'tests/auto-coupon-settings.test.mjs'
      - 'src/app/r/**'
      - 'src/app/api/affiliate/shopify-coupons/**'
      - 'src/lib/hv-shopify-discounts.ts'
      - 'tests/affiliate-landing-code-ref.test.mjs'
      - 'src/lib/short-partner-code.ts'
      - 'src/app/api/admin/coupons/route.ts'
      - 'tests/three-character-affiliate-codes.test.mjs'
      - 'src/app/api/affiliate/promo-code/**'
      - 'src/app/affiliate/coupons/**'
      - 'src/app/login/page.tsx'
      - 'tests/partner-selected-promo-code.test.mjs'
      - '.github/workflows/ugc-crm-ci.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://postgres:password@localhost:5432/affiliate
      JWT_SECRET: build-validation-only-not-a-production-secret
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prisma validate
      - run: npx prisma generate
      - run: npm run verify
      - run: npm run build
