name: Partner CRM validation
on:
  pull_request:
    paths:
      - 'src/app/admin/ugc-crm/**'
      - 'src/app/api/admin/ugc-crm/**'
      - 'src/lib/ugc-crm.ts'
      - 'src/app/admin/layout.tsx'
      - 'prisma/**'
      - 'tests/hv-ugc-crm.test.mjs'
      - '.github/workflows/ugc-crm-ci.yml'
  push:
    branches:
      - 'feat/hv-partner-ugc-crm-20261031'
    paths:
      - 'src/app/admin/ugc-crm/**'
      - 'src/app/api/admin/ugc-crm/**'
      - 'src/lib/ugc-crm.ts'
      - 'src/app/admin/layout.tsx'
      - 'prisma/**'
      - 'tests/hv-ugc-crm.test.mjs'
      - '.github/workflows/ugc-crm-ci.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://postgres:password@localhost:5432/affiliate
      JWT_SECRET: build-validation-only-not-a-production-secret
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prisma validate
      - run: npx prisma generate
      - run: npm run verify
      - run: npm run build
